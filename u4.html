<script>
const I = window.ISB, $=I.$, esc=I.esc, say=I.say;
I.buildShell();
const u = window.DATA.units[3];

I.renderGrammar($('#gram'), u.grammar);
I.renderVocab($('#vocab'), u.vocab, u.id);
I.renderVerbs($('#verbs'), u.verbs);
I.renderDialogs($('#dlgs'), u.dialogs);
const words = I.unitPairs(u), sents = I.unitSentences(u);
I.renderFlash($('#flashW'), words, u.id);
I.renderFlash($('#flashS'), sents, u.id+'s');
I.renderDictation($('#dict'), sents);
I.renderMatch($('#match'), words);
I.renderQuiz($('#quiz'), window.QUIZ[u.id], {save:'quiz-'+u.id});
I.initTabs();



$('#cats').innerHTML = u.catPos.map(c=>
  '<div class="exline"><button class="play" data-say="'+esc(c[0])+'">▶</button>'+
  '<div class="txt"><b>'+esc(c[0])+'</b><span>'+esc(c[1])+'</span></div></div>').join('');
$('#cats').addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s)say(s.dataset.say);});
$('#catAll').onclick=()=>I.TTS.queue(u.catPos.map(c=>({text:c[0],gap:500})));
$('#catStop').onclick=()=>I.TTS.stop();
/* ser/estar/hay/tener 연습 */
(function(){
  const items=[
    ['Mi habitación ___ grande.','es','방의 특징 → ser'],
    ['La cocina ___ al lado del comedor.','está','특정 장소의 위치 → estar'],
    ['En mi habitación ___ una cama.','hay','존재 → hay'],
    ['Mi habitación ___ una ventana.','tiene','갖추고 있음 → tener'],
    ['Los libros ___ en la mesa.','están','특정 복수 주어의 위치 → estar'],
    ['___ dos sillas en la sala.','Hay','존재 → hay'],
    ['Las paredes ___ verdes.','son','특징(복수) → ser'],
    ['Yo ___ una habitación grande.','tengo','소유 → tener'],
    ['¿Dónde ___ el baño?','está','위치를 물음 → estar'],
    ['¿Qué ___ al fondo del pasillo?','hay','존재를 물음 → hay']
  ];
  const opts=['es','son','está','están','hay','tiene','tengo','Hay','soy'];
  $('#seht').innerHTML = items.map((it,ii)=>
    '<div class="exline" style="flex-direction:column;align-items:stretch;gap:8px">'+
    '<b class="es" style="font-size:16.5px">'+esc(it[0])+'</b>'+
    '<div class="chips" data-i="'+ii+'">'+['es','son','está','están','hay','tiene','tengo'].map(o=>
      '<button class="chip" data-o="'+o+'">'+o+'</button>').join('')+'</div>'+
    '<span id="sr'+ii+'" style="font-size:13.5px;display:none"></span></div>').join('');
  $('#seht').addEventListener('click',e=>{
    const b=e.target.closest('[data-o]'); if(!b)return;
    const i=+b.closest('[data-i]').dataset.i, want=items[i][1].toLowerCase();
    const ok = b.dataset.o.toLowerCase()===want;
    b.style.background = ok?'var(--teal)':'var(--brand)'; b.style.color='#fff'; b.style.borderColor='transparent';
    const r=$('#sr'+i); r.style.display='block';
    r.style.color = ok?'var(--teal)':'var(--brand)';
    r.textContent = (ok?'✓ ':'✗ 정답은 '+items[i][1]+' — ')+items[i][2];
    if(ok) say(items[i][0].replace('___',items[i][1]));
  });
})();

</script>
